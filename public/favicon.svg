<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#081a36" />
      <stop offset="50%" stopColor="#0a224a" />
      <stop offset="100%" stopColor="#061329" />
    </linearGradient>

    <!-- Cyan Swoosh & H Gradient -->
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#0ea5e9" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>

    <!-- Golden Shopping Cart Gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="30%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#eab308" />
    </linearGradient>

    <!-- White G Subtle Gradient -->
    <linearGradient id="favWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="70%" stopColor="#f8fafc" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#favBg)" />

  <!-- Speeding Golden Shopping Cart -->
  <g transform="translate(230, 96)">
    <!-- Speed Motion Trails -->
    <line x1="-50" y1="28" x2="-10" y2="28" stroke="url(#favGold)" stroke-width="12" stroke-linecap="round" />
    <line x1="-66" y1="50" x2="-18" y2="50" stroke="url(#favGold)" stroke-width="12" stroke-linecap="round" opacity="0.9" />
    <line x1="-42" y1="72" x2="-8" y2="72" stroke="url(#favGold)" stroke-width="10" stroke-linecap="round" opacity="0.7" />

    <!-- Cart Basket Frame -->
    <path
      d="M0 24 L28 24 L56 82 L158 82 L178 38 L44 38"
      stroke="url(#favGold)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Cart Grid Lines -->
    <line x1="68" y1="56" x2="148" y2="56" stroke="url(#favGold)" stroke-width="8" stroke-linecap="round" />
    <line x1="90" y1="38" x2="100" y2="82" stroke="url(#favGold)" stroke-width="8" />
    <line x1="124" y1="38" x2="134" y2="82" stroke="url(#favGold)" stroke-width="8" />

    <!-- Cart Wheels -->
    <circle cx="72" cy="106" r="13" fill="url(#favGold)" />
    <circle cx="144" cy="106" r="13" fill="url(#favGold)" />
  </g>

  <!-- Big Stylized "G" (White, Bold, Dynamic Italic) -->
  <path
    d="M210 188 C176 188 138 206 114 238 C90 270 82 312 92 354 C104 402 142 434 192 434 C244 434 278 404 290 358 L242 358 C234 380 216 394 192 394 C162 394 140 372 132 342 C126 318 130 292 144 272 C158 252 182 238 208 238 C232 238 250 250 262 268 L298 238 C278 206 246 188 210 188 Z"
    fill="url(#favWhite)"
  />

  <!-- Big Stylized "H" (Cyan / Sky Blue, Bold, Dynamic Italic) -->
  <path
    d="M280 200 L322 200 L308 284 L368 284 L382 200 L424 200 L388 424 L346 424 L360 334 L300 334 L286 424 L244 424 Z"
    fill="url(#favCyan)"
  />

  <!-- Dynamic Cyan Orbital Swoosh wrapping around GH -->
  <path
    d="M84 374 C62 316 88 240 148 204 C208 168 288 178 356 226 C424 274 456 348 424 394 C392 440 310 442 238 430 C166 418 106 392 84 374 Z"
    stroke="url(#favCyan)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-dasharray="720 220"
    fill="none"
    filter="url(#favGlow)"
  />

  <!-- Orbit High-Speed Tail Accent -->
  <path
    d="M386 248 C418 274 440 314 434 354 C428 388 398 418 354 432"
    stroke="#38bdf8"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />
</svg>
