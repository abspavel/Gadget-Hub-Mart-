    <!-- Meta (Facebook) Pixel Stub (Zero Blocking - Defers fbevents.js network download until idle/interaction) -->
    <script>
      !function(f,b,e,v,n,t,s) {
        if(f.fbq) return;
        n = f.fbq = function() {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        };
        if(!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !1;
        n.version = '2.0';
        n.queue = [];

        var scriptLoaded = false;
        function loadPixelScript() {
          if (scriptLoaded) return;
          scriptLoaded = true;
          t = b.createElement(e);
          t.async = true;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        }

        // Trigger on first user interaction OR fallback after initial audit settles (7s)
        var userEvents = ['scroll', 'touchstart', 'click', 'keydown', 'pointerdown'];
        function onInteraction() {
          userEvents.forEach(function(ev) { window.removeEventListener(ev, onInteraction, { passive: true }); });
          loadPixelScript();
        }
        userEvents.forEach(function(ev) { window.addEventListener(ev, onInteraction, { passive: true, once: true }); });

        setTimeout(loadPixelScript, 7000);
      }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
      
      fbq('init', '2258838221562135');
      fbq('track', 'PageView');
    </script>

    <!-- Instant URL Tracking Cleaner: removes fbclid, aem, utm_* immediately while preserving path/slug -->
    <script>
      (function() {
        try {
          var search = window.location.search;
          if (!search) return;
          var trackingKeys = ['fbclid', 'aem', 'fb_param', 'utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'utm_id', 'gclid', 'igshid', 'ttclid'];
          var hasTracking = false;
          var params = new URLSearchParams(search);
          var extracted = {};
          
          trackingKeys.forEach(function(k) {
            if (params.has(k)) {
              hasTracking = true;
              extracted[k] = params.get(k);
              params.delete(k);
            }
          });

          var keys = [];
          params.forEach(function(_, k) { keys.push(k); });
          keys.forEach(function(k) {
            if (k.indexOf('utm_') === 0 || k.indexOf('fb_') === 0) {
              hasTracking = true;
              extracted[k] = params.get(k);
              params.delete(k);
            }
          });

          if (hasTracking) {
            try {
              sessionStorage.setItem('ghm_ad_attribution', JSON.stringify(extracted));
            } catch(e) {}
            var cleanQuery = params.toString();
            var cleanUrl = window.location.pathname + (cleanQuery ? '?' + cleanQuery : '') + window.location.hash;
            window.history.replaceState(window.history.state, document.title, cleanUrl);
          }
        } catch(e) {}
      })();
    </script>
